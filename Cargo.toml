[workspace]
resolver = "3"
members = ["crates/lucy-core", "crates/lucy-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lucy-core = { path = "crates/lucy-core" }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
